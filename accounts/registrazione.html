<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrazione</title>
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <link rel="stylesheet" href="./css/reg/style.css">
</head>
<body>
    <div class="header">
    <div class="titolo" onclick="window.location.href='../index.html'" style="margin-right:3dvh;">
        <img src="../css/imgs/title.png" alt="DAWMarket">
    </div>

</div>
    <div class="form">
        <label for="nome">Nome</label>
        <input type="text" name="nome" id="nome" placeholder="Inserisci il nome">
        <label for="cognome">Cognome</label>
        <input type="text" name="cognome" id="cognome" placeholder="Inserisci il cognome">
        <label for="email">Email</label>
        <input type="email" name="email" id="email" placeholder="Inserisci la mail">
        <label for="password">Password</label>
        <input type="password" name="password" id="password">
        <div class="checkbox-group">
            <input type="checkbox" name="show" id="show" onclick="showPass('password', this)">
            <label for="show">Mostra password</label>
        </div>
        <label for="indirizzo">Indirizzo</label>
        <input type="text" name="indirizzo" id="indirizzo" placeholder="Inserisci l'indirizzo">
        <label for="cap">CAP</label>
        <input type="text" name="cap" id="cap" placeholder="Inserisci il cap">
        <input type="button" value="Registrati" onclick="creaUtente()">
        <p class="login-text">Se hai già un account</p>
        <a href="./login.html">login</a>
    </div>
    <script src="../js/script.js">
    </script>
</body>
</html>
