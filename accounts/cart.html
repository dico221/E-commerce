<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrello</title>
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <link rel="stylesheet" href="css/cart/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<div class="header">
    <div class="titolo" onclick="window.location.href='../index.html'">
        <img src="../css/imgs/title.png" alt="DAWMarket">
    </div>

    <div class="nav">
        <a id="a_account" class="account"></a>
    </div>
</div>

<div id="messaggio-vuoto"></div>
<div id="prodotti"></div>
<div id="totale-carrello"></div>

<div id="pulsanti">
    <input type="button" class="acquista" value="Acquista" onclick="generaPDF()">
</div>

<script>

let account = JSON.parse(localStorage.getItem("account"));
let elementi = localStorage.getItem("csv");

let divPagina = document.getElementById("prodotti");
let messaggioVuoto = document.getElementById("messaggio-vuoto");
let totaleDiv = document.getElementById("totale-carrello");

let trovato = false;
let totaleCarrello = 0;

if (elementi != null && account != null && account.cart != null) {

    let righe = elementi.split('\n');

    for (let id = 0; id < righe.length; id++) {

        let cartItem = account.cart[id];

        if (!cartItem || cartItem[1] <= 0){
            continue;
        }
        trovato = true;

        let quantita = cartItem[1];

        let colonne = righe[account.cart[id][0]].split(',');

        let titoloCSV = colonne[0];
        let marcaCSV = colonne[1];
        let imgCSV = colonne[3];
        let prezzoCSV = parseFloat(colonne[4]);

        totaleCarrello += prezzoCSV * quantita;

        let div = document.createElement("div");
        div.classList.add("prodotto");

        let img = document.createElement("img");
        img.src = imgCSV;
        img.classList.add("img-prodotto");

        let info = document.createElement("div");
        info.classList.add("info");

        let marca = document.createElement("p");
        marca.classList.add("marca");
        marca.innerHTML = marcaCSV;

        let titolo = document.createElement("p");
        titolo.classList.add("nome");
        titolo.innerHTML = titoloCSV;

        let qta = document.createElement("p");
        qta.classList.add("quantita");
        qta.innerHTML = "Quantità: " + quantita;

        let prezzo = document.createElement("p");
        prezzo.classList.add("prezzo");
        prezzo.innerHTML = prezzoCSV + "€";

        let totale = document.createElement("p");
        totale.classList.add("totale");
        totale.innerHTML =
            "Totale: " + (prezzoCSV * quantita).toFixed(2) + "€";

        let bottoni = document.createElement("div");
        bottoni.classList.add("bottoni");

        let meno = document.createElement("input");
        meno.type = "button";
        meno.value = "-";

        let piu = document.createElement("input");
        piu.type = "button";
        piu.value = "+";

        meno.addEventListener("click", () => {

            if (account.cart[id][1] > 0) {
                account.cart[id][1]--;
            }

            localStorage.setItem("account", JSON.stringify(account));
            updateLoginAccount(account);
            location.reload();
        });

        piu.addEventListener("click", () => {

            account.cart[id][1]++;

            localStorage.setItem("account", JSON.stringify(account));
            updateLoginAccount(account);
            location.reload();
        });

        bottoni.appendChild(meno);
        bottoni.appendChild(piu);

        info.appendChild(marca);
        info.appendChild(titolo);
        info.appendChild(prezzo);
        info.appendChild(qta);
        info.appendChild(totale);
        info.appendChild(bottoni);

        div.appendChild(img);
        div.appendChild(info);

        divPagina.appendChild(div);
    }
}

if (trovato) {

    totaleDiv.innerHTML =
        "Totale carrello: " + totaleCarrello.toFixed(2) + "€";

} else {

    let testo = document.createElement("p");
    testo.classList.add("carrello-vuoto");

    testo.innerHTML =
        "Non ci sono prodotti nel carrello.<br>Aggiungi dei prodotti per iniziare.";

    messaggioVuoto.appendChild(testo);

    document.getElementById("pulsanti").style.display = "none";
}

function updateLoginAccount(account2) {

    let logins = JSON.parse(localStorage.getItem("logins"));

    for (let i = 0; i < logins.length; i++) {
        if (logins[i].email === account2.email) {
            logins[i] = account2;
            break;
        }
    }

    localStorage.setItem("logins", JSON.stringify(logins));
}

function generaPDF(){

    const { jsPDF } = window.jspdf;
    let documento = new jsPDF();

    documento.setFontSize(16);
    documento.text("RICEVUTA D'ACQUISTO",10,10);
    documento.setFontSize(10);
    documento.text("Data: " + new Date().toLocaleDateString("it-IT"),10,20);
    documento.text("Utente: " + account.email,10,28);
    documento.setLineWidth(1);       
    documento.setDrawColor(0, 0, 0); 

    documento.line(10, 30, 190, 30);

    
    let righe = elementi.split('\n');
    let y = 40;
    let totale = 0;
    

    for (let i = 0; i < account.cart.length; i++) {
        let idProdotto = account.cart[i][0];
        let quantita   = account.cart[i][1];

        if (quantita <= 0) continue;

        let colonne = righe[idProdotto].split(',');
        
        let marca  = colonne[1]?.trim();
        let nome   = colonne[0]?.trim();
        let prezzo = parseFloat(colonne[4]);
        
        let subtotale = prezzo * quantita;
        totale += subtotale;

        let riga = marca + " | " + nome + " - " + prezzo.toFixed(2) + "€ x" + quantita + " = " + subtotale.toFixed(2) + "€";
        
        documento.text(riga, 10, y);
        y += 10;

        if (y > 280) {
            documento.addPage();
            y = 40;
        }
    }

    y += 5;
    documento.setFontSize(12);
    documento.text("TOTALE: " + totale.toFixed(2) + "€", 10, y);

    let nomeFile = "ricevuta.pdf";
    documento.save(nomeFile);

    account.cart = [];
    localStorage.setItem("account", JSON.stringify(account));
    updateLoginAccount(account);
    

    window.location.href="../index.html";
}


</script>
</body>
</html>
